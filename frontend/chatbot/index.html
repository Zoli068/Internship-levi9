<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Data Agent Terminal (WebSocket)</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            background-color: #f4f7f6;
            color: #333;
            padding: 20px;
            margin: 0;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        h1 {
            color: #2c3e50;
            border-bottom: 2px solid #ecf0f1;
            padding-bottom: 10px;
            margin-top: 0;
            font-size: 24px;
        }
        
        .config-section {
            background-color: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            border: 1px dashed #cbd5e1;
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .config-input {
            flex: 1;
            padding: 10px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-family: monospace;
            font-size: 13px;
        }

        .status-badge {
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            text-transform: uppercase;
        }
        .status-disconnected { background-color: #fee2e2; color: #991b1b; }
        .status-connected { background-color: #dcfce7; color: #166534; }
        .status-connecting { background-color: #fef9c3; color: #854d0e; }

        .chat-section {
            margin-top: 20px;
        }
        .chat-box {
            border: 1px solid #ecf0f1;
            border-radius: 8px;
            background-color: #fafbfc;
            height: 450px;
            overflow-y: auto;
            padding: 20px;
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .message {
            max-width: 75%;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 15px;
            word-wrap: break-word;
        }
        .message.user {
            background-color: #2c3e50;
            color: #ffffff;
            align-self: flex-end;
            border-bottom-right-radius: 2px;
        }
        .message.agent {
            background-color: #e9ecef;
            color: #333333;
            align-self: flex-start;
            border-bottom-left-radius: 2px;
        }
        .message.system {
            background-color: transparent;
            color: #7f8c8d;
            font-style: italic;
            align-self: center;
            font-size: 13px;
        }
        .chat-input-container {
            display: flex;
            gap: 10px;
        }
        .chat-input {
            flex: 1;
            padding: 12px;
            border: 1px solid #dcdde1;
            border-radius: 6px;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s;
        }
        .chat-input:focus {
            border-color: #2c3e50;
        }
        
        .btn {
            display: inline-block;
            background-color: #2c3e50;
            color: #ffffff;
            text-decoration: none;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: 600;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s ease, transform 0.1s ease;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .btn:hover {
            background-color: #34495e;
        }
        .btn:active {
            transform: scale(0.98);
        }
        .btn-connect { background-color: #059669; }
        .btn-connect:hover { background-color: #047857; }
        
        .navigation-section {
            display: flex;
            justify-content: center;
            margin-top: 20px;
        }
        .footer {
            margin-top: 40px;
            font-size: 12px;
            text-align: center;
            color: #7f8c8d;
            border-top: 1px solid #ecf0f1;
            padding-top: 15px;
        }

        /* Dodat stil za animaciju učitavanja dok pristižu paralelni odgovori */
        .loading-dots::after {
            content: ' .';
            animation: dots 1s steps(5, end) infinite;
        }
        @keyframes dots {
            0%, 20% { content: ' .'; }
            40% { content: ' . .'; }
            60% { content: ' . . .'; }
            80%, 100% { content: ''; }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>AI Data Agent Terminal</h1>
        
        <div class="config-section">
            <input type="text" id="wsUrlInput" class="config-input" 
                   placeholder="Unesite AWS WebSocket URL (wss://...)">
            <button class="btn btn-connect" id="connectBtn" onclick="toggleConnection()">Connect</button>
            <span id="statusBadge" class="status-badge status-disconnected">Disconnected</span>
        </div>
         
        <div class="chat-section">
            <div class="chat-box" id="chatBox">
                <div class="message agent">
                    Hello! I am your AI Data Agent. Please enter your WebSocket URL above, connect, and then describe what you want to find or analyze.
                </div>
            </div>
            
            <div class="chat-input-container">
                <input type="text" id="chatInput" class="chat-input" 
                       placeholder="Ask me to query our data..." 
                       onkeypress="handleKeyPress(event)" disabled>
                <button class="btn btn-send" id="sendBtn" onclick="sendMessage()" disabled>Run Query</button>
            </div>
        </div>

        <div class="navigation-section">
            <button class="btn btn-home" onclick="redirectToHome()">Home</button>
        </div>

        <div class="footer">
            &copy; 2026 Weather & AQI Analytics Hub.<br>Application created by: Vladimir Fodor, Aleksandar Velickovic, Zoltan Lacko
        </div>
    </div>

    <script>
        let socket = null;
        // Niz u kojem čuvamo "loading" elemente kako bismo uklonili onaj pravi kada stigne odgovor
        let activeLoadingElements = []; 

        const cryptoObj = window.crypto || window.msCrypto;
        const sessionId = String(Math.floor(Date.now() / 1000));
        console.log("Generating sessionID", sessionId);

        document.addEventListener("DOMContentLoaded", () => {
            const savedUrl = localStorage.getItem("aws_ws_url");
            if (savedUrl) {
                document.getElementById("wsUrlInput").value = savedUrl;
            }
        });

        function redirectToHome() {
            window.location.href = window.location.origin;
        }

        function handleKeyPress(event) {
            // Uklonjen uslov isWaitingForResponse
            if (event.key === 'Enter' && socket && socket.readyState === WebSocket.OPEN) {
                sendMessage();
            }
        }

        function toggleConnection() {
            const urlInput = document.getElementById("wsUrlInput");
            const connectBtn = document.getElementById("connectBtn");

            if (socket && socket.readyState === WebSocket.OPEN) {
                socket.close();
                return;
            }

            const url = urlInput.value.trim();
            if (!url) {
                alert("Please enter valid URL for the Websocket");
                return;
            }

            localStorage.setItem("aws_ws_url", url);
            updateStatus("connecting", "Connecting...");
            connectBtn.disabled = true;

            try {
                socket = new WebSocket(url);

                socket.onopen = () => {
                    updateStatus("connected", "Connected");
                    connectBtn.innerText = "Disconnect";
                    connectBtn.disabled = false;
                    setInputsDisabled(false);
                    appendMessage("Successfully connected", "system");
                };

                socket.onmessage = (event) => {
                    // Kada stigne bilo koji odgovor, uklanjamo najstariji aktivni "loading" indikator
                    if (activeLoadingElements.length > 0) {
                        const oldestLoading = activeLoadingElements.shift();
                        oldestLoading.remove();
                    }

                    try {
                        const responseData = JSON.parse(event.data);
                        
                        if (responseData && responseData.answerText) {
                            appendMessage(responseData.answerText, 'agent');
                        } else if (responseData && responseData.error) {
                            appendMessage(`Error: ${responseData.error}`, 'system');
                        }
                    } catch (e) {
                        appendMessage(event.data, 'agent');
                    }
                };

                socket.onclose = () => {
                    updateStatus("disconnected", "Disconnected");
                    connectBtn.innerText = "Connect";
                    connectBtn.disabled = false;
                    setInputsDisabled(true);
                    appendMessage("System: Connection with the server is closed", "system");
                    
                    // Čišćenje svih preostalih loading elemenata ako pukne veza
                    activeLoadingElements.forEach(el => el.remove());
                    activeLoadingElements = [];
                };

                socket.onerror = (error) => {
                    console.error("WebSocket Error:", error);
                    appendMessage("Error while communicating with the web socket", "system");
                    if (activeLoadingElements.length > 0) {
                        const oldestLoading = activeLoadingElements.shift();
                        oldestLoading.remove();
                    }
                };

            } catch (err) {
                console.error("Initialization failed", err);
                updateStatus("disconnected", "Disconnected");
                connectBtn.disabled = false;
            }
        }

        function sendMessage() {
            const inputElement = document.getElementById('chatInput');
            const promptText = inputElement.value.trim();

            // Uklonjen uslov isWaitingForResponse, polja više NE postaju disabled
            if (!promptText || !socket || socket.readyState !== WebSocket.OPEN) return;

            appendMessage(promptText, 'user');
            inputElement.value = ''; 

            // Kreiramo sistemsku poruku sa animacijom tri tačkice i guramo je u niz praćenja
            const loadingDiv = appendMessage('Generating response', 'system');
            loadingDiv.classList.add('loading-dots');
            activeLoadingElements.push(loadingDiv);

            const payload = {
                questionText: promptText,  
                sessionID: sessionId      
            };

            socket.send(JSON.stringify(payload));
            
            // Fokus ostaje na inputu kako bi korisnik odmah kucao sledeće pitanje
            inputElement.focus();
        }

        function updateStatus(type, text) {
            const badge = document.getElementById("statusBadge");
            badge.className = `status-badge status-${type}`;
            badge.innerText = text;
        }

        function setInputsDisabled(disabled) {
            document.getElementById('chatInput').disabled = disabled;
            document.getElementById('sendBtn').disabled = disabled;
            if (!disabled) {
                document.getElementById('chatInput').focus();
            }
        }

        function appendMessage(text, sender) {
            const chatBox = document.getElementById('chatBox');
            const messageDiv = document.createElement('div');
            
            messageDiv.classList.add('message', sender);
            messageDiv.innerText = text;
            
            chatBox.appendChild(messageDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
            
            return messageDiv;
        }
    </script>
</body>
</html>
